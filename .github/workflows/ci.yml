name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdr-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Compose integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up -d --build --wait

      - name: Run Django checks
        run: |
          docker compose exec -T application python manage.py check
          docker compose exec -T application python manage.py makemigrations --check --dry-run

      - name: Run test suite
        run: docker compose exec -T application python manage.py test -v 0

      - name: Verify health endpoint
        run: curl --fail --show-error --silent http://127.0.0.1:8082/health/

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans
